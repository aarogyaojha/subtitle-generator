# Language for this run — must match a supported Whisper language code
language: ne  # ne = Nepali, ja = Japanese

# Controls model size/quantization only — not pipeline logic.
# colab -> large-v3, int8, full diarization + correction stage
# local -> smaller/quantized model, int8, batch_size=1, tuned for 4GB-class GPUs
hardware_tier: colab

# Subtitle formatting — not universal constants, vary by standard and language
# (CJK languages in particular need far lower CPS than English)
max_chars_per_line: 42
max_lines_per_cue: 2
max_cps: 17
min_cue_duration: 0.8
max_cue_duration: 7.0
min_gap_between_cues: 0.1

# Diarization
num_speakers: null   # leave null to let pyannote infer automatically